# Staging mirror of deploy/nginx/semaycollection.com.conf.
#
# Structurally identical on purpose — same map, same locations, same proxy
# headers, same timeouts. Only the upstream hostnames (compose service names
# rather than 127.0.0.1) and the certificate paths differ. If a directive is
# wrong here it is wrong in production, which is the entire point of running it.
#
# Mounted at /etc/nginx/conf.d/default.conf, which nginx includes from inside
# http{} — so `map` is legal here, exactly as it is in a sites-enabled file.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/staging.crt;
    ssl_certificate_key /etc/nginx/certs/staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 120M;

    # SMS relay. BOTH trailing slashes are load-bearing: together they strip the
    # /sms prefix so /sms/3rdparty/v1/message arrives as /3rdparty/v1/message.
    location /sms/ {
        proxy_pass http://relay:8081/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # Must exceed the relay's 25s long-poll hold.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # Media straight off disk, never through Node.
    location /media/ {
        alias /media/;
        access_log off;
        try_files $uri =404;
    }

    # Everything else is the API. No trailing slash on proxy_pass: the API owns
    # its own paths (/api/v1/…, /health, /ws) and they must arrive unmodified.
    location / {
        proxy_pass http://api:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
