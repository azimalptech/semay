# Complete nginx site for semaycollection.com.
#
#   sudo cp deploy/nginx/semaycollection.com.conf /etc/nginx/sites-available/semaycollection.com
#   sudo ln -sf /etc/nginx/sites-available/semaycollection.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Self-contained ON PURPOSE. The `map` below has to live in `http` context, and
# a file included from sites-enabled/ IS inside http{}, so putting it here
# means this config needs no edit to /etc/nginx/nginx.conf. An earlier version
# of this shipped as a fragment that referenced $connection_upgrade without
# defining it — which fails `nginx -t` with "unknown variable" and, if someone
# restarts rather than reloads, takes the whole site down.
#
# CONFIRM BEFORE USE — these are inferred from the running deployment, not read
# from it:
#   * certificate paths (§ssl below) — check what certbot actually issued
#   * web-admin's internal port (3001) must match PORT= in
#     deploy/semay-web-admin.service
#   * MEDIA root must match MEDIA_DIR in server/.env

# Maps the Upgrade header to the right Connection value, for both websocket and
# ordinary requests. Required by every proxy_pass below that carries a socket.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── :80 — redirect everything to TLS ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name semaycollection.com www.semaycollection.com;

    # Leave this reachable over plain HTTP or certbot renewal breaks.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :443 — the API, media, and the SMS relay ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name semaycollection.com www.semaycollection.com;

    ssl_certificate     /etc/letsencrypt/live/semaycollection.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semaycollection.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Uploads are capped at 120MB server-side (media/routes.ts). nginx's 1MB
    # default would reject every video long before the app ever saw it.
    client_max_body_size 120M;

    # ── SMS relay ──
    # BOTH trailing slashes are load-bearing: together they strip the /sms
    # prefix, so /sms/3rdparty/v1/message reaches the relay as
    # /3rdparty/v1/message. Remove either one and every relay call 404s.
    location /sms/ {
        proxy_pass http://127.0.0.1:8081/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # MUST exceed the relay's 25s long-poll hold, or nginx severs the very
        # fallback transport that exists to survive proxy problems.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ── Media ──
    # Served by nginx directly rather than through Node: media is the
    # highest-bandwidth path in the app, and a static file server does it at
    # near-zero CPU instead of competing with API requests for the event loop.
    # The trailing slash on `alias` is required.
    location /media/ {
        alias /opt/semay/media/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Everything else: the API ──
    # No trailing slash on proxy_pass here, deliberately — the API owns its own
    # paths (/api/v1/..., /health, /ws) and they must arrive unmodified.
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # The app holds one long-lived WebSocket per client for realtime; the
        # 60s default would drop every idle one.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── :3000 — the Super Admin panel ───────────────────────────────────────────
# Separate port, so the panel is trivially firewall-able to an office IP
# without touching the public API. It is the one password-authenticated
# surface in the system and deserves that option.
server {
    listen 3000 ssl;
    listen [::]:3000 ssl;
    http2 on;
    server_name semaycollection.com www.semaycollection.com;

    ssl_certificate     /etc/letsencrypt/live/semaycollection.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/semaycollection.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        # 3001, not 3000 — nginx owns 3000. Must match PORT= in
        # deploy/semay-web-admin.service.
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}
