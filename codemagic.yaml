# Codemagic build pipelines.
#
# iOS can only be compiled on macOS, and this project is developed on Windows,
# so a hosted macOS build is the only route to an iOS binary. Config lives here
# rather than in Codemagic's UI so it is reviewable and versioned like the rest
# of the deployment setup.
#
# BEFORE THE FIRST RUN, in the Codemagic UI (these are Apple credentials and do
# not belong in this file or in git):
#   1. Team settings → Integrations → App Store Connect: add an API key.
#      Name it `semay-app-store` to match `integrations:` below.
#   2. Apple Developer Portal: register the bundle id `com.semay.semay`, and
#      create the app in App Store Connect. Codemagic can issue the signing
#      certificate and profile itself once the API key is connected.
#   3. Set APP_STORE_APPLE_ID below to the app's numeric Apple ID from App
#      Store Connect (App Information → General → Apple ID).

workflows:
  ios-testflight:
    name: iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: semay-app-store
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.semay.semay
      vars:
        # Compiled into the binary. Without it api_client.dart falls back to
        # http://localhost:8080/api/v1 — which on a phone means the phone — so
        # the build would succeed and the app could never reach the server.
        # Must be https: iOS App Transport Security refuses cleartext, and an
        # http value fails only once the app is on a device.
        API_BASE_URL: "https://semaycollection.com/api/v1"
        APP_STORE_APPLE_ID: 0000000000 # replace with the real numeric Apple ID
    scripts:
      - name: Reject a non-https API URL
        script: |
          case "$API_BASE_URL" in
            https://*) echo "API base URL: $API_BASE_URL" ;;
            *) echo "API_BASE_URL must be https (got '$API_BASE_URL')"; exit 1 ;;
          esac

      - name: Fail early if the iOS usage strings are missing
        script: |
          # iOS terminates the process when the camera or photo library is
          # touched with no usage string, so a build without these ships an app
          # that crashes the first time someone tries to post a picture. Cheap
          # to assert here; expensive to discover from a TestFlight tester.
          PLIST=mobile/ios/Runner/Info.plist
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription; do
            grep -q "$key" "$PLIST" || { echo "$PLIST is missing $key"; exit 1; }
          done
          echo "usage strings present"

      - name: flutter pub get
        script: flutter pub get
        working_directory: mobile

      - name: Install pods
        script: |
          # The Podfile is generated by Flutter and is not committed, so it may
          # not exist on a clean checkout.
          find . -name "Podfile" -exec echo "found {}" \; || true
          flutter precache --ios
          pod install --project-directory=ios || true
        working_directory: mobile

      - name: Build signed ipa
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist
        working_directory: mobile

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # TestFlight only. Promoting to the App Store stays a manual decision in
        # App Store Connect — an automatic submission on every green build is
        # not something a CI file should be able to do.
        submit_to_testflight: true
        submit_to_app_store: false

  # Signed for direct install on registered devices. NOT published anywhere —
  # no TestFlight, no App Store review. The ipa this produces installs straight
  # onto any iPhone whose UDID is in the provisioning profile, and stays valid
  # for the life of the certificate (about a year) rather than the 7 days a
  # free-Apple-ID sideload gives you.
  #
  # Signing is wired up EXPLICITLY with the Codemagic CLI instead of through an
  # `environment.ios_signing:` block. That block only *fetches* signing files
  # that already exist, so against a bundle id whose App ID was just created it
  # fails before a build machine is even allocated:
  #     No matching profiles found for bundle identifier "com.semay.semay"
  #     and distribution type "ad_hoc"
  # `fetch-signing-files --create` creates the missing profile instead of
  # erroring on it, which is what makes this reachable from a Windows machine
  # with no Mac to export a .p12 from.
  #
  # ONE-TIME APPLE SETUP (done 2026-09-02):
  #   1. Devices → register the iPhone UDID. A device registered *after* a
  #      profile is created is not in it — delete the profile and let this
  #      recreate it.
  #   2. Identifiers → register com.semay.semay.
  #   3. Codemagic team settings → Integrations → Developer Portal → add an
  #      App Store Connect API key named `semay-app-store`, Admin access.
  ios-adhoc:
    name: iOS ad-hoc (installable, not published)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: semay-app-store
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.semay.semay"
        API_BASE_URL: "https://semaycollection.com/api/v1"
    scripts:
      - name: Reject a non-https API URL
        script: |
          case "$API_BASE_URL" in
            https://*) echo "API base URL: $API_BASE_URL" ;;
            *) echo "API_BASE_URL must be https (got '$API_BASE_URL')"; exit 1 ;;
          esac

      - name: Fail early if the iOS usage strings are missing
        script: |
          # iOS terminates the process when the camera or photo library is
          # touched with no usage string, so a build without these ships an app
          # that crashes the first time someone tries to post a picture. This
          # is the build that goes on a real handset, so assert it here too.
          PLIST=mobile/ios/Runner/Info.plist
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription; do
            grep -q "$key" "$PLIST" || { echo "$PLIST is missing $key"; exit 1; }
          done
          echo "usage strings present"

      - name: Create and install the ad-hoc signing files
        script: |
          set -e
          keychain initialize

          # fetch-signing-files can only CREATE a signing certificate when it
          # has a private key to sign the request with. Given none it logs
          #     Cannot save Signing Certificates without certificate private key
          # and then EXITS 0, so the build carries on and dies two minutes
          # later inside Flutter as "No valid code signing certificates were
          # found" — an error that points at Xcode instead of at this step.
          #
          # The CLI reads the key from CERTIFICATE_PRIVATE_KEY. Set that as an
          # encrypted variable in the Codemagic UI to reuse ONE certificate
          # across builds; Apple caps an account at 2 distribution
          # certificates, and without it every build burns a new one.
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "CERTIFICATE_PRIVATE_KEY is unset — generating a throwaway key"
            openssl genrsa -out /tmp/cert_key.pem 2048
            CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
            export CERTIFICATE_PRIVATE_KEY
          fi

          # --create makes the ad-hoc profile that does not exist yet, and
          # enrolls every device registered on the team — that is what puts the
          # test iPhone inside the profile.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_ADHOC \
            --create

          keychain add-certificates
          # Points the Xcode project at the fetched profile and writes
          # ~/export_options.plist, which the build step below consumes.
          xcode-project use-profiles

          # Both commands above warn rather than fail when they fetched
          # nothing, which is exactly how the previous build got two minutes
          # past a signing failure. Assert the profile actually landed so the
          # build stops at the real cause.
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
            || { echo "no provisioning profile installed — signing setup failed"; exit 1; }

      - name: flutter pub get
        script: flutter pub get
        working_directory: mobile

      - name: Build ad-hoc ipa
        script: |
          flutter build ipa --release \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist
        working_directory: mobile

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # No `publishing:` block at all — the ipa is downloaded from the build page
    # and installed directly. Nothing leaves Codemagic.

  # Compiles without signing, so it can run before any Apple setup exists. Use
  # it to prove the iOS code builds; the artifact is NOT installable.
  ios-unsigned:
    name: iOS build (unsigned, no Apple account needed)
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: "https://semaycollection.com/api/v1"
    scripts:
      - name: flutter pub get
        script: flutter pub get
        working_directory: mobile
      - name: Build unsigned
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=$API_BASE_URL
        working_directory: mobile
      - name: Package ipa
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr semay-unsigned.ipa Payload
        working_directory: mobile
    artifacts:
      - mobile/semay-unsigned.ipa
