# nginx location block for the SMS relay.
#
# Paste inside the existing `server { listen 443 ssl; server_name
# semaycollection.com; ... }` block, alongside the API and /media locations.
#
# The trailing slash on both `location /sms/` and `proxy_pass ...:8081/` is
# load-bearing: it strips the /sms prefix, so /sms/3rdparty/v1/message reaches
# the relay as /3rdparty/v1/message. Drop either slash and every request 404s.

location /sms/ {
    proxy_pass http://127.0.0.1:8081/;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket upgrade. Without these two headers nginx silently downgrades
    # the upgrade to a plain request and the socket never establishes — the
    # handset then falls back to polling and everything still works, which is
    # exactly why this is easy to leave broken and never notice.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # MUST exceed the relay's 25s long-poll hold, or nginx kills the fallback
    # transport mid-hold and the handset sees a stream of failed polls. The
    # default is 60s, which happens to work; setting it explicitly means a
    # future tightening of the global default cannot quietly break OTP.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Long-polling responses are small and latency-sensitive; buffering them
    # only adds delay to an OTP someone is waiting on.
    proxy_buffering off;
}

# Put this in the http{} block (NOT inside server{}) if it is not already
# present — it is what makes the Upgrade header above work for both websocket
# and ordinary requests:
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }
