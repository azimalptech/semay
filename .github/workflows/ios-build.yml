# Builds an UNSIGNED iOS .ipa on GitHub's macOS runners — iOS can only be
# compiled on macOS, so from a Windows dev machine this cloud build is the
# way to get an iOS binary. Trigger it manually from the GitHub Actions tab
# (workflow_dispatch), then download the artifact from the run page.
#
# NOTE: the artifact is unsigned. To put it on an iPhone you still need
# Apple-side signing: either an Apple Developer account (TestFlight / ad-hoc)
# or a sideloading tool like AltStore/Sideloadly with a free Apple ID.
name: iOS build (unsigned)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL to compile in (must be https — iOS ATS blocks cleartext)"
        required: true
        default: "https://semaycollection.com/api/v1"

jobs:
  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Fail before the 10-minute build rather than after it. iOS App Transport
      # Security refuses cleartext by default, so an http:// URL compiles fine
      # and then cannot reach the server from any real device — the kind of
      # defect that only shows up once the ipa is on a phone.
      - name: Reject a non-https API URL
        run: |
          case "${{ inputs.api_base_url }}" in
            https://*) echo "API base URL: ${{ inputs.api_base_url }}" ;;
            *) echo "::error::api_base_url must start with https:// (got '${{ inputs.api_base_url }}')"; exit 1 ;;
          esac

      # --dart-define is REQUIRED. Without it api_client.dart falls back to
      # http://localhost:8080/api/v1, which on a phone means the phone itself —
      # so the build succeeds and the app can never reach the API. The Android
      # release build passes the same flag.
      - run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr semay-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: semay-ios-unsigned
          path: mobile/semay-unsigned.ipa
